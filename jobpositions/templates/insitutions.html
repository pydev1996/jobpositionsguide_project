<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Login Popup</title>
    <style>
        /* Style for the overlay */
        #overlay {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        /* Style for the popup */
        #popup {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* Style for the close button */
        #closeBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
     <h1>hello</h1>
    <!-- Popup overlay -->
    <div id="overlay">
        <!-- Popup content -->
        <div id="popup">
            <span id="closeBtn" onclick="closePopup()">&times;</span>
            <p>If you are an instructor, please <a href="/institutor_login">login here</a>.</p>
            <button onclick="closePopup()">Cancel</button>
        </div>
    </div>

    <script>
        // Function to close the popup
        function closePopup() {
            document.getElementById("overlay").style.display = "none";
        }

        // Automatically open the popup when the page loads
        window.onload = function() {
            document.getElementById("overlay").style.display = "flex";
        };
    </script>

</body>
</html>
