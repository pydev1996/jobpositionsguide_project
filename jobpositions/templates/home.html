<!-- jobpositionsguide_project/jobpositions/templates/jobpositions/job_positions_list.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Job Positions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            background-color: #f8f8f8;
            padding-top: 40px;
        }

        .container {
            max-width: 1000px;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            border-radius: 10px;
            margin: 0 auto;
        }

        h1 {
            color: #007bff;
            font-size: 36px;
            margin-bottom: 20px;
            text-align: center;
        }

        .logo img {
            float: left;
            
            width: 170px;
            height:70px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            margin-bottom: 60px;
        }

        .search-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            position: relative;
            top:30px;
            left:50px;
        }

        .search-btn {
            margin-left: 10px;
            padding: 8px 20px;
            border: none;
            background-color: #007bff;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            position: relative;
            top:30px;
            left:60px;
        }

        .job-positions {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
        }

        .job-box {
            flex: 0 0 48%;
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 10px;
        }

        .job-box a {
            text-decoration: none;
            color: #333;
            transition: color 0.3s;
            font-size: 18px;
            font-weight: bold;
        }

        .job-box a:hover {
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <!-- Add your logo image here -->
            <img src="/static/images/logo3.png" alt="Logo">
        </div>
        
        <div class="search-bar">
            <form action="{% url 'job_positions_list' %}" method="GET">
                <input type="text" class="search-input" name="q" placeholder="Search job positions..." value="{{ request.GET.q }}">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>
        <div class="job-positions">
            {% for job_position in job_positions %}
            <div class="job-box">
                <a href="{% url 'job_position_detail' job_position.id %}">{{ job_position.title }}</a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
