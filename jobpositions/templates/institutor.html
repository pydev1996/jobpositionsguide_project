<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutor Home</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .username {
            text-align: right;
            color: #555;
        }

        .logout {
            text-align: right;
            margin-top: 10px;
        }

        .logout a {
            color: #4caf50;
            text-decoration: none;
            font-weight: bold;
        }

        .logout a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>INSTITUTOR</h1>
    </header>

    <div class="container">
        <div class="username">
            Welcome, <strong>{{ institutor_username }}</strong>!
        </div>

        <!-- Add your content for the Institutor's home page here -->

        <div class="logout">
            <a href="{% url 'institutor_login' %}">Logout</a>
        </div>
    </div>

</body>
</html>
