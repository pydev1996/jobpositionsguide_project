<!DOCTYPE html>
<html>
<head>
    <title>Job Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f8f8;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
            text-align: center;
        }

        .logo img {
            max-width: 180px;
            height: auto;
        }

        .category-title {
            font-size: 36px;
            margin-bottom: 40px;
            color: #333;
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .category-btn {
            padding: 12px 30px;
            border: none;
            background-color: #007bff;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s;
        }

        .category-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/static/images/logo3.png" alt="Logo">
        </div>
        
        <h1 class="category-title">Choose a Category</h1>
        
        <div class="category-buttons">
            <a class="btn category-btn" href="{% url 'job_category' 'IT' %}">IT</a>
            <a class="btn category-btn" href="{% url 'job_category' 'Medical' %}">Medical</a>
            <a class="btn category-btn" href="{% url 'job_category' 'Electrical' %}">Electrical</a>
            <a class="btn category-btn" href="{% url 'job_category' 'Electronics' %}">Electronics</a>
            <a class="btn category-btn" href="{% url 'job_category' 'BPO' %}">BPO</a>
            <a class="btn category-btn" href="{% url 'job_category' 'Construction Field' %}">Construction Field</a>
            <a class="btn category-btn" href="{% url 'job_category' 'Mechanical' %}">Mechanical</a>
        </div>
    </div>
</body>
</html>
