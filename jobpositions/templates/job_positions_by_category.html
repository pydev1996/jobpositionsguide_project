<!DOCTYPE html>
<html>
<head>
    <title>Job Positions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f8f8;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
            text-align: center;
        }

        .logo img {
            max-width: 180px;
            height: auto;
        }

        .job-title {
            font-size: 36px;
            margin-bottom: 40px;
            color: #333;
        }

        .search-bar {
            text-align: center;
            margin-bottom: 20px;
        }

        .search-input {
            padding: 10px;
            border: 2px solid #007bff;
            border-radius: 5px;
            font-size: 16px;
            width: 60%;
            outline: none;
        }

        .search-btn {
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            outline: none;
        }

        .search-btn:hover {
            background-color: #0056b3;
        }

        .job-list {
            text-align: left;
        }

        .job-list-item {
            margin-bottom: 10px;
            padding: 15px;
            border: 1px solid #ccc;
            background-color: #ffffff;
            border-radius: 10px;
        }

        .job-list-item a {
            text-decoration: none;
            color: #333;
            font-size: 18px;
            transition: color 0.3s;
            font-weight: bold;
        }

        .job-list-item a:hover {
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/static/images/logo3.png" alt="Logo">
        </div>
        
        <h1 class="job-title">Explore Job Positions - {{ category }}</h1>
        
        <div class="search-bar">
            <form action="" method="GET">
                <input type="text" class="search-input" name="q" placeholder="Search job positions..." value="{{ request.GET.q }}">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>
        
        <div class="job-list">
            <ul class="list-group">
                {% for job_position in job_positions %}
                <li class="job-list-item">
                    <a href="{% url 'job_position_detail' job_position.id %}">{{ job_position.title }}</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
