<!DOCTYPE html>
<html>
<head>
    <title>Job Positions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo img {
            max-width: 200px;
            height: auto;
        }

        .search-bar {
            text-align: center;
            margin-bottom: 40px;
        }

        .search-input {
            padding: 10px;
            border: 2px solid #007bff;
            border-radius: 5px;
            font-size: 16px;
            width: 60%;
            outline: none;
        }

        .search-btn {
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            outline: none;
        }

        .search-btn:hover {
            background-color: #0056b3;
        }

        .job-positions {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 20px;
        }

        .job-box {
            flex: 0 0 calc(33.33% - 20px);
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 10px;
            transition: transform 0.3s;
        }

        .job-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .job-box a {
            text-decoration: none;
            color: #007bff;
            font-size: 18px;
            font-weight: bold;
            transition: color 0.3s;
        }

        .job-box a:hover {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="/static/images/logo3.png" alt="Logo">
            </div>
            <h1>Explore Job Positions</h1>
        </div>
        
        <div class="search-bar">
            <form action="" method="GET">
                <input type="text" class="search-input" name="q" placeholder="Search job positions..." value="{{ request.GET.q }}">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>
        <div class="job-positions">
            {% for job_position in job_positions %}
            <div class="job-box">
                <a href="{% url 'job_position_detail' job_position.id %}">{{ job_position.title }}</a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
