<!-- jobpositionsguide_project/jobpositions/templates/jobpositions/job_position_detail.html -->
<!DOCTYPE html>
<html>
<head>
    <title>{{ job_position.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            background-color: #f8f8f8;
            padding-top: 40px;
        }

        .container {
            max-width: 800px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .header h1 {
            font-size: 36px;
            color: #007bff;
            margin-bottom: 20px;
        }

        .section-heading h2 {
            font-size: 24px;
            color: #333;
            margin-top: 30px;
        }

        .description-list {
            list-style: none;
            padding-left: 0;
            margin-top: 15px;
        }

        .description-list li {
            margin-bottom: 10px;
            border-left: 2px solid #007bff;
            padding-left: 10px;
            color: #555;
        }

        .skills-list {
            list-style: none;
            padding-left: 0;
            margin-top: 15px;
        }

        .skills-list li {
            margin-bottom: 8px;
            color: #555;
        }

        .skills-list li:before {
            content: "✓ ";
            color: #007bff;
            font-weight: bold;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ job_position.title }}</h1>
        </div>
        <div class="section-heading">
            <h2>Descriptions</h2>
            <ul class="description-list">
                {% for jd in jd %}
                <li>{{ jd }}</li>
                {% endfor %}
            </ul>
        </div>
        <div class="section-heading">
            <h2>Skills</h2>
            <ul class="skills-list">
                {% for skill in skills %}
                <li>{{ skill }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
