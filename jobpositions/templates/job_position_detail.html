<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="te" xml:lang="te">
<head>
    <title>{{ job_position.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f8f8f8;
            padding-top: 40px;
        }

        .container {
            max-width: 800px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 36px;
            color: #007bff;
            margin-bottom: 20px;
        }

        .section-heading h2 {
            font-size: 24px;
            color: #333;
            margin-top: 30px;
        }

        .language-dropdown {
            margin-bottom: 20px;
        }

        .description-list {
            list-style: none;
            padding-left: 0;
            margin-top: 15px;
        }

        .description-list li {
            margin-bottom: 20px;
            border-left: 2px solid #007bff;
            padding-left: 10px;
            color: #555;
        }

        .answer {
            color: #333;
        }

        .skills-list {
            list-style: none;
            padding-left: 0;
            margin-top: 15px;
        }

        .skills-list li {
            margin-bottom: 8px;
            color: #555;
        }

        .skills-list li:before {
            content: "✓ ";
            color: #007bff;
            font-weight: bold;
            margin-right: 5px;
        }

        /* Additional styles as needed */

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ job_position.title }}</h1>
        </div>
        <div class="section-heading">
            <h2>Description</h2>
            <div class="language-dropdown">
                <form method="post">
                    {% csrf_token %}
                    <label for="language-select">Select Language:</label>
                    <select id="language-select" name="lang">
                        <option value="en">English</option>
                        <option value="te">Telugu</option>
                        <option value="hi">Hindi</option>
                        <!-- Add more language options as needed -->
                    </select>
                    <button type="submit">Change Language</button>
                </form>
            </div>
            <ul class="description-list">
                {% for question,answer in questions_and_answers %}
                <li>
                    <strong>{{ question }}</strong><br>
                    <span class="answer">{{ answer }}</span>
                </li>
                {% endfor %}
            </ul>
        </div>
        <div class="section-heading">
            <h2>Skills</h2>
            <ul class="skills-list">
                {% for skill in skills %}
                <li>{{ skill }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
