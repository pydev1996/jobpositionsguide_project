<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutor Signup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            
            color: #333;
        }

        form {
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        form label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        form input {
            width: 100%;
            padding: 8px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        form button {
            background-color: #4caf50;
            color: #fff;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        form button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    

    <form method="post" action="{% url 'institutor_signup' %}">
        <h1>Institutor Signup</h1>
        {% csrf_token %}
        <label for="username">Username:</label>
        {{ form.username }}
        
        <label for="phone_number">Phone Number:</label>
        {{ form.phone_number }}
        
        <label for="email">Email:</label>
        {{ form.email }}
        
        <label for="password">Password:</label>
        {{ form.password }}
        
        <label for="repassword">Re-enter Password:</label>
        {{ form.repassword }}

        <button type="submit">Sign Up</button>
    </form>

</body>
</html>
